<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/tokens.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body {
    background: var(--bg-app);
    font-family: var(--font-sans);
    color: var(--ink-1);
    display:flex; flex-direction:column; justify-content:center;
    padding: 0 96px;
    position:relative;
  }
  /* mismo glow que el CTA de la página */
  body::after {
    content:""; position:absolute; width:620px; height:620px;
    right:-260px; top:-280px; border-radius:999px; pointer-events:none;
    background: radial-gradient(circle, rgba(233,106,77,.34) 0%, rgba(233,106,77,0) 62%);
  }
  .brand { display:flex; align-items:center; gap:20px; margin-bottom:52px; }
  .brand span { font-size:46px; font-weight:800; letter-spacing:-0.03em; }
  h1 { font-size:82px; font-weight:800; letter-spacing:-0.035em; line-height:1.02; }
  .strike { position:relative; display:inline-block; color: var(--ink-3); }
  .strike::after {
    content:""; position:absolute; left:-3%; right:-3%; top:56%;
    height:.12em; background: var(--accent); border-radius:999px;
    transform: rotate(-3deg);
  }
  .lead { margin-top:34px; font-size:26px; line-height:1.5; color: var(--ink-2); max-width:760px; }
  .foot {
    position:absolute; left:96px; bottom:58px;
    font-family: var(--font-mono); font-size:16px; letter-spacing:.14em;
    text-transform:uppercase; color: var(--ink-3);
  }
</style>
</head>
<body>
  <div class="brand">
    <svg width="72" height="72" viewBox="0 0 96 96" aria-hidden="true">
      <rect width="96" height="96" rx="22" fill="#111"></rect>
      <rect x="20" y="22" width="56" height="14" rx="3" fill="#FAF8F4"></rect>
      <path d="M41 36 H47 V74 H41 Z" fill="#FAF8F4"></path>
      <path d="M49 36 H55 V74 H49 Z" fill="#E96A4D"></path>
    </svg>
    <span>Typple</span>
  </div>
  <h1>Settle bills.<br>Without the <span class="strike">awkward</span> ask.</h1>
  <p class="lead">Scan any receipt with AI, split it fairly, and get paid back.</p>
  <div class="foot">typpleapp.com</div>
</body>
</html>
