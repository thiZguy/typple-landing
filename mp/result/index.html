<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Typple — Mercado Pago</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; display: flex;
      min-height: 100vh; align-items: center; justify-content: center;
      margin: 0; background: #faf9f7; color: #1a1a1a; text-align: center; }
    .box { padding: 24px; max-width: 360px; }
    .mark { font-size: 44px; line-height: 1; margin-bottom: 8px; }
    .ok { color: #1f9d55; }
    .err { color: #d64545; }
    h2 { margin: 8px 0; font-size: 22px; }
    .muted { color: #6b6b6b; }
    a.btn { display: inline-block; margin-top: 16px; padding: 12px 20px;
      background: #1a1a1a; color: #fff; border-radius: 12px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark" id="mark">…</div>
    <h2 id="status">Procesando…</h2>
    <p class="muted" id="hint">Un momento.</p>
    <a class="btn" id="back" href="typpleapp://" style="display:none">
      Volver a Typple
    </a>
  </div>

  <script>
    // Página de RESULTADO de la vinculación OAuth con Mercado Pago.
    // El canje de tokens y el alta en mp_accounts ya ocurrieron del lado del
    // server (Edge Function mp-oauth-callback). Acá solo mostramos el
    // desenlace que la función pasó por query string y rebotamos a la app.
    function qp(name) {
      return new URLSearchParams(window.location.search).get(name);
    }
    var status = qp('status');
    var reason = qp('reason');

    var el = {
      mark: document.getElementById('mark'),
      status: document.getElementById('status'),
      hint: document.getElementById('hint'),
      back: document.getElementById('back'),
    };

    // Mensajes de error por motivo (los que emite mp-oauth-callback).
    var ERRORS = {
      denied: {
        title: 'Vinculación cancelada',
        hint: 'No se vinculó Mercado Pago. Podés intentarlo de nuevo desde la app.',
      },
      bad_state: {
        title: 'El enlace expiró',
        hint: 'Volvé a la app e iniciá la vinculación de nuevo.',
      },
      exchange_failed: {
        title: 'No pudimos vincular',
        hint: 'Hubo un problema con Mercado Pago. Probá de nuevo en unos minutos.',
      },
    };

    function showOk() {
      el.mark.textContent = '✓';
      el.mark.className = 'mark ok';
      el.status.textContent = 'Mercado Pago vinculado';
      el.hint.textContent = 'Ya podés cobrar tus divisiones. Volvé a Typple.';
      el.back.style.display = 'inline-block';
      // Camino feliz: reabre la app por deep link (custom scheme).
      window.location.href = 'typpleapp://';
    }

    function showError(r) {
      var e = ERRORS[r] || {
        title: 'No pudimos vincular',
        hint: 'Volvé a la app e intentá de nuevo.',
      };
      el.mark.textContent = '✕';
      el.mark.className = 'mark err';
      el.status.textContent = e.title;
      el.hint.textContent = e.hint;
      el.back.style.display = 'inline-block';
      // En error NO auto-rebotamos: dejamos que el usuario lea y decida.
    }

    if (status === 'ok') {
      showOk();
    } else if (status === 'error') {
      showError(reason);
    } else {
      // Sin status reconocible: llegaron acá fuera del flujo. Ofrecemos volver.
      el.mark.textContent = '↩';
      el.mark.className = 'mark';
      el.status.textContent = 'Volvé a Typple';
      el.hint.textContent = 'Abrí la app para continuar.';
      el.back.style.display = 'inline-block';
    }
  </script>
</body>
</html>
